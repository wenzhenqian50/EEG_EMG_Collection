<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEG & EMG 联合采集终端</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- 装饰球提供更好的折射效果 -->
    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div class="container">
        <div class="input-group">
            <input type="text" id="ui-username" class="name-input" placeholder="输入采集者姓名..." />
        </div>

        <div class="info-section">
            <div class="phase-text" id="ui-phase">等待启动</div>
            <div class="action-text" id="ui-action">--</div>
        </div>
        
        <div class="countdown-text" id="ui-countdown">0.0</div>

        <div class="controls">
            <button class="btn-start" onclick="sendCommand('start')">
                <svg class="icon"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                启动
            </button>
            <button class="btn-pause" onclick="sendCommand('pause')">
                <svg class="icon"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                暂停
            </button>
            <button class="btn-undo" onclick="sendCommand('undo')">
                <svg class="icon"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
                撤销
            </button>
        </div>
    </div>

    <script>
        const uiPhase = document.getElementById('ui-phase');
        const uiAction = document.getElementById('ui-action');
        const uiCountdown = document.getElementById('ui-countdown');
        const uiUsername = document.getElementById('ui-username');

        let ws = new WebSocket(`ws://${window.location.host}/ws/state`);
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            uiPhase.innerText = data.phase_name;
            
            // 仅在“运动准备阶段”和“动作执行阶段”显示具体动作
            const isMotorPhase = data.phase_name.includes("运动准备") || data.phase_name.includes("执行");
            uiAction.innerText = (data.current_action && isMotorPhase) ? data.current_action.toUpperCase() : "--";
            
            uiCountdown.innerText = Math.max(0, data.countdown).toFixed(1);

            // 动态颜色变更
            if (data.phase_name.includes("暂停") || data.phase_name.includes("等待")) {
                uiCountdown.style.color = "var(--text-muted)";
                uiAction.style.color = "var(--text-muted)";
                uiPhase.style.color = "var(--text-muted)";
            } else if (data.phase_name.includes("放松")) {
                uiCountdown.style.color = "var(--success)";
                uiAction.style.color = "var(--success)";
                uiPhase.style.color = "var(--success)";
            } else if (data.phase_name.includes("执行")) {
                uiCountdown.style.color = "var(--danger)";
                uiAction.style.color = "var(--danger)";
                uiPhase.style.color = "var(--danger)";
            } else {
                uiCountdown.style.color = "var(--accent)";
                uiAction.style.color = "var(--text-main)";
                uiPhase.style.color = "var(--text-muted)";
            }
        };

        async function sendCommand(cmd) {
            let name = uiUsername.value.trim();
            if (cmd === 'start' && !name) {
                alert("请先输入采集者姓名再启动!");
                uiUsername.focus();
                return;
            }
            if (cmd === 'start') {
                uiUsername.disabled = true;
                uiUsername.style.opacity = '0.7';
            }

            try {
                await fetch(`/api/control`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd, subject_name: name || 'Unknown' })
                });
            } catch (err) {
                console.error("指令发送失败:", err);
            }
        }

        ws.onclose = () => {
            console.log('WebSocket 断开，尝试重连...');
            setTimeout(() => window.location.reload(), 3000);
        };
    </script>
</body>
</html>
